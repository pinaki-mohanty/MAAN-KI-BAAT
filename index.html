        body {

            display: flex;
            flex-direction: column;

            justify-content: center;

            font-family: 'Arial', sans-serif;

        }

        .button {
            background-color: #ff6f81; /* Red button color */
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #e63946; /* Darker red on hover */
        }

        p {
            color: #e63946; /* Dark red text color */
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #e63946; /* Dark red link color */

        }
